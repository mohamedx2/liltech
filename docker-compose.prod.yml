# Production stack for the LilTech VPS.
#
# Managed by the GitHub Actions deploy job (.github/workflows/ci.yml), which
# copies this file to /opt/liltech and writes /opt/liltech/.env from repository
# secrets. Do not edit this file on the server — change it in the repository.
#
# Bring up manually:     docker compose -f docker-compose.prod.yml up -d
# Watch the API logs:    docker compose -f docker-compose.prod.yml logs -f api
# Watch the web logs:    docker compose -f docker-compose.prod.yml logs -f web
# Stop everything:       docker compose -f docker-compose.prod.yml down
#
# Images and the database password come from .env (written by CI):
#   API_IMAGE / WEB_IMAGE — ghcr.io image references
#   POSTGRES_PASSWORD     — random 32-char secret, never committed
#
# Ports: caddy publishes 80/443 (public entrypoint, TLS for
# liltechsousse.com). The web (3000) and API (4000) ports stay published as
# a direct fallback; the database is reachable only inside the compose
# network.

services:
  postgres:
    image: postgres:17-alpine
    container_name: liltech-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liltech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-liltech}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-liltech} -d ${POSTGRES_DB:-liltech}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot service: applies pending Prisma migrations before the API starts.
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liltech}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liltech}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['prisma', 'migrate', 'deploy']

  # One-shot service: provisions the administrator account from the
  # SEED_ADMIN_* variables in .env (idempotent; no-op when unset).
  seed:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liltech}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liltech}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['node', 'dist/seed-build/prisma/seed.js']

  # Operator-only one-shot service. It is behind a profile, is not part of the
  # normal deploy dependency chain, and never runs unless explicitly invoked.
  ctf-provision:
    profiles: ['ctf-operations']
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liltech}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liltech}?schema=public
      # Compose mounts the `ctf_answers` secret at /run/secrets/<secret name>.
      CTF_PROVISION_FILE: /run/secrets/ctf_answers
    secrets:
      - ctf_answers
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['node', 'dist/seed-build/prisma/provision-ctf.js']

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: liltech-api-prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liltech}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-liltech}?schema=public
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: liltech-web-prod
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api

  # Public entrypoint: terminates TLS for liltechsousse.com (certificates are
  # obtained and renewed automatically) and routes /api/* to the API.
  caddy:
    image: caddy:2-alpine
    container_name: liltech-caddy-prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

secrets:
  ctf_answers:
    file: ${CTF_PROVISION_HOST_FILE:-/opt/liltech/secrets/ctf-answers.json}
